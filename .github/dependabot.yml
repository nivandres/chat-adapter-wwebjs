version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      vitest:
        patterns: [vitest, "@vitest/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: whatsapp-web.js
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
